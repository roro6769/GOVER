<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0a12">
  <title>GOVER — A VHS Adventure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b203c'/%3E%3Crect x='2' y='4' width='12' height='8' fill='%23111218'/%3E%3Crect x='3' y='6' width='4' height='3' fill='%23d95a3f'/%3E%3Crect x='9' y='6' width='4' height='3' fill='%23f2e8c9'/%3E%3Crect x='3' y='10' width='10' height='1' fill='%235d6478'/%3E%3C/svg%3E">

  <div id="shell">

      <canvas id="game" width="480" height="270" tabindex="0"

  <script src="js/font.js"></script>

</html>
